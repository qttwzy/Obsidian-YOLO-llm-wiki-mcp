<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#1F6FEB"/></linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3FB950"/><stop offset="100%" stop-color="#238636"/></linearGradient>
    <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F0883E"/><stop offset="100%" stop-color="#D29922"/></linearGradient>
    <linearGradient id="gCyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#39D2C0"/><stop offset="100%" stop-color="#1B9E8F"/></linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F85149"/><stop offset="100%" stop-color="#DA3633"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="arrowW" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3.5 L0,7z" fill="#8B949E"/></marker>
    <marker id="arrowG" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3.5 L0,7z" fill="#3FB950"/></marker>
    <marker id="arrowR" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3.5 L0,7z" fill="#F85149"/></marker>
    <marker id="arrowC" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,3.5 L0,7z" fill="#39D2C0"/></marker>
  </defs>
  <rect width="860" height="240" rx="12" fill="#0D1117"/>

  <!-- Step 1: Store -->
  <rect x="16" y="75" width="108" height="56" rx="10" fill="url(#gBlue)" filter="url(#shadow)"/>
  <text x="70" y="97" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">📦 页面向量库</text>
  <text x="70" y="115" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">page_embeddings</text>

  <line x1="124" y1="103" x2="158" y2="103" stroke="#8B949E" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Step 2: Iterate -->
  <rect x="162" y="75" width="108" height="56" rx="10" fill="#161B22" stroke="#58A6FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="216" y="97" text-anchor="middle" fill="#58A6FF" font-size="11" font-weight="600">🔄 遍历页面对</text>
  <text x="216" y="115" text-anchor="middle" fill="#8B949E" font-size="10">O(n²) 全组合</text>

  <line x1="270" y1="103" x2="304" y2="103" stroke="#8B949E" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Step 3: Cosine -->
  <rect x="308" y="75" width="108" height="56" rx="10" fill="#161B22" stroke="#58A6FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="362" y="97" text-anchor="middle" fill="#58A6FF" font-size="11" font-weight="600">📐 余弦相似度</text>
  <text x="362" y="115" text-anchor="middle" fill="#8B949E" font-size="10">cos(θ) = A·B/|A||B|</text>

  <line x1="416" y1="103" x2="450" y2="103" stroke="#8B949E" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Decision 1: Threshold -->
  <polygon points="498,65 546,103 498,141 450,103" fill="#161B22" stroke="#F0883E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="498" y="100" text-anchor="middle" fill="#F0883E" font-size="10" font-weight="600">≥ 阈值?</text>
  <text x="498" y="114" text-anchor="middle" fill="#8B949E" font-size="9">minScore</text>

  <!-- No path -->
  <line x1="498" y1="141" x2="498" y2="185" stroke="#F85149" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="508" y="163" fill="#F85149" font-size="9">否</text>

  <!-- Decision 2: Wikilink -->
  <line x1="546" y1="103" x2="580" y2="103" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="563" y="95" fill="#3FB950" font-size="9">是</text>

  <polygon points="628,65 676,103 628,141 580,103" fill="#161B22" stroke="#F0883E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="628" y="100" text-anchor="middle" fill="#F0883E" font-size="10" font-weight="600">有链接?</text>
  <text x="628" y="114" text-anchor="middle" fill="#8B949E" font-size="9">[[wikilink]]</text>

  <!-- Has link → skip -->
  <line x1="628" y1="141" x2="628" y2="185" stroke="#F85149" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="638" y="163" fill="#F85149" font-size="9">有</text>

  <!-- Decision 3: Skipped -->
  <line x1="676" y1="103" x2="710" y2="103" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="693" y="95" fill="#3FB950" font-size="9">无</text>

  <polygon points="758,65 806,103 758,141 710,103" fill="#161B22" stroke="#F0883E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="758" y="100" text-anchor="middle" fill="#F0883E" font-size="10" font-weight="600">误报?</text>
  <text x="758" y="114" text-anchor="middle" fill="#8B949E" font-size="9">skipped</text>

  <!-- Skipped → skip -->
  <line x1="758" y1="141" x2="758" y2="185" stroke="#F85149" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="768" y="163" fill="#F85149" font-size="9">是</text>

  <!-- All three skip targets merge -->
  <rect x="460" y="188" width="340" height="32" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
  <text x="630" y="209" text-anchor="middle" fill="#484F58" font-size="10">⏭️ 跳过</text>

  <!-- Not skipped → output -->
  <line x1="806" y1="103" x2="830" y2="103" stroke="#3FB950" stroke-width="1.5"/>
  <text x="813" y="95" fill="#3FB950" font-size="9">否</text>
  <rect x="808" y="75" width="44" height="56" rx="8" fill="url(#gCyan)" filter="url(#shadow)"/>
  <text x="830" y="100" text-anchor="middle" fill="#fff" font-size="14">✓</text>

  <!-- Bottom label -->
  <text x="430" y="232" text-anchor="middle" fill="#484F58" font-size="10">三重过滤：相似度阈值 → 已有链接排除 → 误报标记排除</text>
</svg>